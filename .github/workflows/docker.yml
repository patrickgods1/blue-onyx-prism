# Builds the Docker image (Dockerfile, no push) and starts it: the entrypoint must accept the
# volumes and GET /v1/status must answer 200 (a model compiled and ready); then the web UI over
# HTTPS on 32169 (scripts/ci/check_https.sh: answers, needs a sign-in, the plain port 32168 sends
# browsers there) and `setup-code` in the container. Runs only when the image's inputs change, on
# PRs and on main. The Rust build inside the image dominates (~15 min).
name: docker

on:
  push:
    branches: [main]
    paths: &paths
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "src/resources/catalog/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/ci/check_https.sh"
      - ".github/workflows/docker.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        timeout-minutes: 25
        run: docker build -t blue-onyx-prism:ci .

      - name: Start it and wait for /v1/status
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Host folders for the volumes docker-compose.yml mounts; the container user is not ours.
          mkdir -p ci-vol/cache ci-vol/config ci-vol/data
          chmod 777 ci-vol/cache ci-vol/config ci-vol/data
          docker run -d --name bop \
            -p 127.0.0.1:32168:32168 \
            -p 127.0.0.1:32169:32169 \
            -v "$PWD/ci-vol/cache:/app/cache" \
            -v "$PWD/ci-vol/config:/app/config" \
            -v "$PWD/ci-vol/data:/app/data" \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            blue-onyx-prism:ci
          ok=0
          for i in $(seq 1 120); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:32168/v1/status || true)"
            echo "attempt $i: /v1/status -> $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' bop)" != "true" ]; then
              echo "::error::the container exited"
              break
            fi
            sleep 5
          done
          docker logs bop 2>&1 | tail -n 100
          [ "$ok" = 1 ] || { echo "::error::/v1/status never answered 200"; exit 1; }
          curl -fsS http://127.0.0.1:32168/v1/status; echo

      # The web UI: HTTPS on its own port, behind a sign-in; Blue Iris stays on plain HTTP. The
      # first account needs the one-time setup code, printed in the container (in the data volume's
      # private auth folder).
      - name: HTTPS and the setup code
        timeout-minutes: 5
        run: |
          set -euo pipefail
          scripts/ci/check_https.sh 32168 32169
          out="$(docker exec bop /app/blue-onyx-prism --config /app/config/blue_onyx_prism_config.json setup-code)"
          echo "$out" | grep -v '^Setup code:'
          echo "$out" | grep -Eq '^Setup code: [A-Z2-7-]{20,}' || { echo "::error::setup-code printed no code"; exit 1; }
          docker exec bop test -f /app/data/auth/setup-code || { echo "::error::no setup-code file in /app/data/auth"; exit 1; }
          [ "$(docker exec bop stat -c %a /app/data/auth)" = 700 ] || { echo "::error::/app/data/auth is not 0700"; exit 1; }
          [ "$(docker exec bop stat -c %a /app/data/auth/setup-code)" = 600 ] || { echo "::error::the setup-code file is not 0600"; exit 1; }

      - name: Stop
        if: always()
        run: docker rm -f bop || true
