# How to make a release
# - Update `version` in Cargo.toml and merge to main
# - git tag X.Y.Z && git push origin X.Y.Z
# - Edit the draft release created by this workflow and publish it
# Each build job also builds its native installers (packaging/: MSI, deb + rpm, pkg), installs,
# checks and uninstalls them on the runner, and uploads them next to the archive.
# (workflow_dispatch builds the archives and creates a draft for the Cargo.toml version, without a tag.
#  It refuses to run when the tag X.Y.Z already exists: the archives would be built from main HEAD,
#  not the tagged commit. Any run refuses when a published release X.Y.Z exists, so published
#  assets and their .sha256 files are never replaced; a draft is updated in place.)

name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# Read-only by default; only the attest job (OIDC token + attestation write) and the release job
# (contents write), neither of which builds anything, get more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            ext: zip
            ort_flavor: directml
          # 22.04, not latest: the binaries (and the deb/rpm) need the build runner's glibc or
          # newer, and 2.35 covers Ubuntu 22.04+, Debian 12 and RHEL 9.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            ext: tar.gz
            ort_flavor: cpu
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            ext: tar.gz
            ort_flavor: auto # CoreML build on Apple silicon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0 # keep equal to rust-toolchain.toml
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Determine version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$VERSION" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NAME=blue-onyx-prism-$VERSION-${{ matrix.label }}" >> "$GITHUB_ENV"
          # Read by the binary with option_env! (`--version`, /v1/status, build_info metric).
          echo "BLUE_ONYX_PRISM_GIT_SHA=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          echo "BLUE_ONYX_PRISM_BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Build release (default features, OpenVINO + ONNX Runtime)
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Stage files
        shell: bash
        run: |
          set -euo pipefail
          OUT="target/${{ matrix.target }}/release"
          STAGE="dist/$NAME"
          mkdir -p "$STAGE/scripts"
          if [ "$RUNNER_OS" = "Windows" ]; then
            for b in blue-onyx-prism blue-onyx-prism-service blue-onyx-prism-benchmark test-blue-onyx-prism; do
              cp "$OUT/$b.exe" "$STAGE/"
            done
            cp scripts/*.ps1 "$STAGE/scripts/"
          else
            # The service binary is Windows-only (a stub elsewhere), so it is not shipped.
            for b in blue-onyx-prism blue-onyx-prism-benchmark test-blue-onyx-prism; do
              cp "$OUT/$b" "$STAGE/"
            done
            cp scripts/*.sh "$STAGE/scripts/"
            chmod +x "$STAGE"/blue-onyx-prism* "$STAGE"/test-blue-onyx-prism "$STAGE"/scripts/*.sh
            mkdir -p "$STAGE/deploy"
            if [ "$RUNNER_OS" = "Linux" ]; then
              cp deploy/blue-onyx-prism.service "$STAGE/deploy/"
            else
              cp deploy/com.blueonyx.prism.plist "$STAGE/deploy/"
            fi
          fi
          cp scripts/export_model.py scripts/convert_onnx_to_ir.py scripts/requirements-export.txt "$STAGE/scripts/"
          # LICENSE (this project) and the notices of everything the archive bundles: OpenVINO,
          # ONNX Runtime, DirectML, the embedded font and the Rust crates in the binaries.
          cp README.md LICENSE THIRD_PARTY_LICENSES.md "$STAGE/"
          mkdir -p "$STAGE/models"
          "$OUT/blue-onyx-prism" setup-openvino --dest "$STAGE/openvino"
          # Default ONNX Runtime flavor per OS (default features build the `ort` backend, load-dynamic).
          # NVIDIA users run `setup-onnxruntime --flavor cuda` to swap it.
          "$OUT/blue-onyx-prism" setup-onnxruntime --flavor ${{ matrix.ort_flavor }} --dir "$STAGE/onnxruntime"
          find "$STAGE" -maxdepth 2 | sort

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a -tzip "$NAME.zip" "$NAME" >/dev/null
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME.${{ matrix.ext }}" > "$NAME.${{ matrix.ext }}.sha256"
          else
            shasum -a 256 "$NAME.${{ matrix.ext }}" > "$NAME.${{ matrix.ext }}.sha256"
          fi
          cat "$NAME.${{ matrix.ext }}.sha256"

      # The installers do not bundle OpenVINO / ONNX Runtime: the service downloads them on first
      # start. Unsigned for now (packaging/build-installers.sh marks where signing goes).
      - name: Build installers
        shell: bash
        run: packaging/build-installers.sh ${{ matrix.target }} dist

      - name: Smoke-test installers (install, check the service answers, uninstall)
        shell: bash
        working-directory: dist
        run: ../packaging/smoke-test-installers.sh .

      - name: Upload installer logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs-${{ matrix.label }}
          path: dist/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}
          path: |
            dist/${{ env.NAME }}.${{ matrix.ext }}
            dist/${{ env.NAME }}.${{ matrix.ext }}.sha256
            dist/*.msi
            dist/*.deb
            dist/*.rpm
            dist/*.pkg
            dist/*.msi.sha256
            dist/*.deb.sha256
            dist/*.rpm.sha256
            dist/*.pkg.sha256
          if-no-files-found: error

  # Build provenance (SLSA, signed through GitHub's OIDC token) for every archive and installer, so a user can
  # check a download with `gh attestation verify <file> --repo <owner/repo>` (docs/RELEASE_CHECKLIST.md).
  attest:
    name: attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.msi
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.pkg

  release:
    name: draft release
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Determine version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -l artifacts
      - name: Refuse to replace a tagged or published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || env.VERSION }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] \
            && [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "tag $TAG exists: bump the Cargo.toml version, or re-run the workflow for the tag" >&2
            exit 1
          fi
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) \
            && [ "$draft" != "true" ]; then
            echo "release $TAG is already published; its assets are not replaced" >&2
            exit 1
          fi
      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || env.VERSION }}
          name: ${{ env.VERSION }}
          draft: true
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
