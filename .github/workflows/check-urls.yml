# Weekly dependency checks. Nothing here changes a pin; each job reports to one issue, so it is seen by
# whoever watches the repository, not only by the cron's last editor. GitHub disables a schedule after
# 60 days without repository activity: re-enable it on the Actions tab.
#
# - check-urls: every pinned download in the resource catalog (src/resources/catalog/) still answers
#   with its catalogued size: OpenVINO, ONNX Runtime, DirectML, the NVIDIA wheels and the models, for
#   every platform. Hashes are pinned in the binary; this catches moved or deleted files before users
#   hit them. Issue "Catalog URL check failed" (a comment per failed run).
# - upstream: pins with a newer upstream release (catalog runtimes, uv, the Python export/train
#   pins), with the pins held back on purpose listed apart (scripts/ci/check_deps.py HOLDS). Issue
#   "Upstream updates available", kept current; closed once every pin is current.
# - advisories: RustSec advisories against Cargo.lock on main (CI runs them only on push / PR, so an
#   advisory published against an unchanged lock is otherwise unseen) and OSV advisories against every
#   hashed Python lock. Issue "Dependency advisories", kept current; closed once clean.
name: Weekly dependency checks

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only the jobs that report may open or comment on issues.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0 # keep equal to rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check every catalog URL
        run: |
          set -o pipefail
          cargo run --locked --quiet -- list-resources --check-urls 2>&1 | tee "$RUNNER_TEMP/check-urls.txt"
      - name: Report the failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "The check of the pinned download URLs in src/resources/catalog/ failed: $RUN_URL"
            echo
            echo "A moved or deleted file breaks first-run downloads for users. Update the pin (URL, size, SHA-256) in a reviewed commit, or re-run the workflow if it was a transient outage."
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/check-urls.txt" 2>/dev/null || echo "(no output captured)"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          scripts/ci/report_issue.sh comment "Catalog URL check failed" "$RUNNER_TEMP/body.md"

  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the pins with upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Upstream updates available"
          rc=0
          python3 -I scripts/ci/check_deps.py upstream --out "$RUNNER_TEMP/report.md" || rc=$?
          { cat "$RUNNER_TEMP/report.md"; echo; echo "Checked by $RUN_URL"; } > "$RUNNER_TEMP/body.md"
          case "$rc" in
            0) scripts/ci/report_issue.sh close "$title" "$RUNNER_TEMP/body.md" ;;
            10) scripts/ci/report_issue.sh replace "$title" "$RUNNER_TEMP/body.md" ;;
            *) exit "$rc" ;;
          esac

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: RustSec advisories (cargo-deny)
        id: deny
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
      - name: OSV advisories of the Python locks, and the report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DENY: ${{ steps.deny.outcome }}
        run: |
          set -euo pipefail
          title="Dependency advisories"
          rc=0
          python3 -I scripts/ci/check_deps.py audit --out "$RUNNER_TEMP/report.md" || rc=$?
          [ "$rc" = 2 ] && exit 2
          {
            if [ "$DENY" != success ]; then
              echo "\`cargo deny check advisories\` failed on main: a RustSec advisory now matches Cargo.lock. The log is in $RUN_URL (step \"RustSec advisories\"). Fix with \`cargo update -p <crate>\`, or an ignore with a reason and a review date in deny.toml."
              echo
            fi
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "Checked by $RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          if [ "$DENY" != success ] || [ "$rc" = 10 ]; then
            scripts/ci/report_issue.sh replace "$title" "$RUNNER_TEMP/body.md"
          else
            scripts/ci/report_issue.sh close "$title" "$RUNNER_TEMP/body.md"
          fi
