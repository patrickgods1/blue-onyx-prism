name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # scripts/ci/smoke.sh: the served model name and a label it must detect on the test image.
  MODEL_NAME: IPcam-general
  EXPECT_LABEL: vehicle

jobs:
  check:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test (e.g. a provider deadlock) must not hold a runner for the default 6 h. A cold
    # Windows build plus the release build and every test takes about 40 min.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0 # keep equal to rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (OpenVINO only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Build (OpenVINO only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --locked --no-default-features
      # Fixture-dependent tests are #[ignore]d here; they run in "Integration tests (real models)".
      - name: Unit tests (no OpenVINO needed)
        run: cargo test --locked
      - name: Build release (all binaries)
        run: cargo build --locked --release --bins
      # Downloads retry (scripts/ci/retry.sh): the CLI fails fast on a network error by design.
      - name: Fetch OpenVINO runtime
        shell: bash
        run: scripts/ci/retry.sh 4 20 cargo run --locked --release -- setup-openvino --dest target/release/openvino
      # IPcam-general detects the test image's car and bicycle as "vehicle", so every smoke run
      # can require at least one prediction with that label (a provider that answers success with
      # no boxes fails).
      - name: Download IPcam-general
        shell: bash
        run: scripts/ci/retry.sh 4 20 cargo run --locked --release -- download-models --name IPcam-general --dir target/release/models
      # RT-DETRv2 (i64 orig_target_sizes input, stretch preprocessing, the CoreML pinned-batch
      # path): without it the RT-DETR parts of the integration tests are skipped. YOLO26 needs an
      # AGPL export and stays a manual release-checklist step.
      - name: Download RT-DETRv2 small
        shell: bash
        run: scripts/ci/retry.sh 4 20 cargo run --locked --release -- download-models --name rt-detrv2-s --dir target/release/models
      # Each smoke run uses its own port so a slow shutdown of the previous server cannot collide.
      # scripts/ci/smoke.sh <bin> <client> <port> <provider substring> <server args...>
      # MODEL_NAME / EXPECT_LABEL are set for the whole job below.
      - name: Smoke test (OpenVINO CPU)
        shell: bash
        run: |
          set -euo pipefail
          EXE=""
          case "$RUNNER_OS" in Windows) EXE=".exe";; esac
          scripts/ci/smoke.sh "target/release/blue-onyx-prism$EXE" "target/release/test-blue-onyx-prism$EXE" \
            32168 "OpenVINO" \
            --model target/release/models/IPcam-general.onnx --family yolo5 --force-cpu \
            --cache-dir target/release/cache
      - name: Fetch ONNX Runtime (CPU)
        shell: bash
        run: scripts/ci/retry.sh 4 20 cargo run --locked --release -- setup-onnxruntime --flavor cpu --dir target/release/onnxruntime
      # The ignored tests need models/, openvino/ and onnxruntime/ (flat, as `--dir` installs it) under
      # BLUE_ONYX_TEST_ROOT, which is where the steps above installed them. A missing fixture fails
      # the test. They run on the debug test binaries (reusing the cargo cache); the runtime is found
      # through the root, not through the binary's location.
      - name: Integration tests (real models)
        run: cargo test --locked -- --ignored --test-threads=1
        env:
          BLUE_ONYX_TEST_ROOT: ${{ github.workspace }}/target/release
      - name: Smoke test (ONNX Runtime CPU)
        shell: bash
        run: |
          set -euo pipefail
          EXE=""
          case "$RUNNER_OS" in Windows) EXE=".exe";; esac
          scripts/ci/smoke.sh "target/release/blue-onyx-prism$EXE" "target/release/test-blue-onyx-prism$EXE" \
            32169 "ONNX Runtime" \
            --model target/release/models/IPcam-general.onnx --family yolo5 --device ort:cpu \
            --onnxruntime-dir target/release/onnxruntime --cache-dir target/release/cache
      # The hosted macOS runners are Apple Silicon. The IPcam YOLOv5 model is the one the CoreML
      # rewrite path (onnx_rewrite.rs) exists for. The ORT build is the CPU flavor fetched above
      # (the macOS package includes the CoreML provider).
      - name: Smoke test (ONNX Runtime CoreML)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/smoke.sh target/release/blue-onyx-prism target/release/test-blue-onyx-prism \
            32170 "CoreML" \
            --model target/release/models/IPcam-general.onnx --family yolo5 --device ort:coreml \
            --onnxruntime-dir target/release/onnxruntime --cache-dir target/release/cache
      # DirectML runs on the WARP software adapter on hosted runners. Not required yet: it is made
      # a required step once it proves stable (drop continue-on-error then).
      - name: Fetch ONNX Runtime (DirectML)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: scripts/ci/retry.sh 4 20 cargo run --locked --release -- setup-onnxruntime --flavor directml --dir target/release/onnxruntime-directml
      - name: Smoke test (ONNX Runtime DirectML, WARP)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/smoke.sh target/release/blue-onyx-prism.exe target/release/test-blue-onyx-prism.exe \
            32171 "DirectML" \
            --model target/release/models/IPcam-general.onnx --family yolo5 --device ort:directml \
            --onnxruntime-dir target/release/onnxruntime-directml --cache-dir target/release/cache

  supply-chain:
    name: supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources
