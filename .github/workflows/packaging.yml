# Builds the native installers (packaging/) and installs, checks and uninstalls them on each runner,
# then upgrades from the latest published release to them (packaging/upgrade-test.sh), without
# releasing anything. release.yml runs the same build and smoke-test scripts for a release.
# Also on source changes (src/**, Cargo.lock), on PRs and on main, so a change that breaks an
# installer or the upgrade is caught before a release, not by it. About 15-25 min per runner, in
# parallel with CI (the Windows build dominates); a newer push to the same PR cancels the run.
name: packaging

on:
  push:
    branches: [main]
    paths: &paths
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - "templates/**"
      - "tests/data/dog_bike_car.jpg"
      - "tests/data/runs-v0-with-history.json"
      - "packaging/**"
      - "deploy/**"
      - "scripts/*systemd*"
      - "scripts/*launchd*"
      - "scripts/ci/retry.sh"
      - "scripts/ci/check_https.sh"
      - ".github/workflows/packaging.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  installers:
    name: installers (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - os: ubuntu-22.04 # same glibc floor as release.yml
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0 # keep equal to rust-toolchain.toml
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Limits: at least twice the slowest green run of the step (18, 3 and 6 min).
      - name: Build release
        timeout-minutes: 40
        run: cargo build --release --locked --bins --target ${{ matrix.target }}
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: |
          shellcheck -x -S warning scripts/*systemd*.sh scripts/*launchd*.sh packaging/*.sh \
            packaging/linux/*.sh packaging/linux/debian/* packaging/linux/rpm/*.sh \
            packaging/macos/*.sh packaging/macos/scripts/* packaging/release/*.sh \
            scripts/ci/check_https.sh
      - name: Test package scriptlets
        if: runner.os == 'Linux'
        run: packaging/linux/test-scriptlets.sh
      # release.yml's gate (job ci-green): its decisions against the fixtures in testdata/.
      - name: Test the release CI gate
        if: runner.os == 'Linux'
        run: python3 -I packaging/release/ci_green.py --self-test
      # The README promises RHEL 9 (glibc 2.34); the runner has 2.35 (packaging/linux/glibc-floor).
      - name: Check the glibc the binaries need
        if: runner.os == 'Linux'
        run: |
          packaging/linux/check-glibc.sh target/${{ matrix.target }}/release/blue-onyx-prism \
            target/${{ matrix.target }}/release/blue-onyx-prism-benchmark \
            target/${{ matrix.target }}/release/test-blue-onyx-prism
      - name: Build installers
        shell: bash
        timeout-minutes: 15
        run: packaging/build-installers.sh ${{ matrix.target }} dist
      - name: Smoke-test installers
        shell: bash
        timeout-minutes: 25
        working-directory: dist
        run: ../packaging/smoke-test-installers.sh .
      # From the latest published release (gh release download) to the installer built above:
      # seeded config edit, label file, frame and runs.json kept, service up, one detection.
      - name: Upgrade from the latest release
        shell: bash
        timeout-minutes: 30
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../packaging/upgrade-test.sh ${{ matrix.target }} .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installers-${{ matrix.label }}
          path: |
            dist/*.msi
            dist/*.deb
            dist/*.rpm
            dist/*.pkg
            dist/*.log
          if-no-files-found: ignore
