[graph]
all-features = true

[advisories]
version = 2
# Each ignore states why it is acceptable and when to look again; on that date check for a fixed
# release or a replacement crate, then remove the ignore or move the date.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, no fix; only via ab_glyph to draw labels on saved images, parsing the embedded font only. Review by 2027-04-01" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained (repo archived), no fix; only via serde_yaml_ng for local classes YAML files. Review by 2027-04-01" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, no fix; only via glib-macros in tray-icon/tao's Linux GTK deps, which are never built (the tray is Windows and macOS only; Cargo.toml gates tray-icon/tao to those targets). Review by 2027-04-01" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "IJG",                # jpeg-encoder (IJG OR Zlib OR Apache-2.0)
    "CDLA-Permissive-2.0", # webpki-roots data
]
# r-efi is (MIT OR Apache-2.0 OR LGPL-2.1-or-later); the permissive options satisfy it.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
