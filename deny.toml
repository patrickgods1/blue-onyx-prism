[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # Unmaintained (no fix exists); only reached via ab_glyph, used to draw labels on saved images.
    "RUSTSEC-2026-0192", # ttf-parser
    # Unmaintained (repo archived, no fix exists); only reached via serde_yaml_ng, used for classes YAML.
    "RUSTSEC-2024-0449", # unsafe-libyaml
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "IJG",                # jpeg-encoder (IJG OR Zlib OR Apache-2.0)
    "CDLA-Permissive-2.0", # webpki-roots data
]
# r-efi is (MIT OR Apache-2.0 OR LGPL-2.1-or-later); the permissive options satisfy it.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
