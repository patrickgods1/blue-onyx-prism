# The image ships OpenVINO (Intel GPU via /dev/dri, and CPU) plus the ONNX Runtime CPU build
# (`ort:cpu`). CUDA/NVIDIA is not available in this image; `"device": "auto"` picks openvino:gpu
# when /dev/dri is passed through, else openvino:cpu.
services:
  blue-onyx-prism:
    image: blue-onyx-prism:latest
    build:
      context: ..
    container_name: blue-onyx-prism
    restart: unless-stopped
    # Same check as the image's HEALTHCHECK (repeated so it survives a custom image).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:32168/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    # Time for the graceful drain after SIGTERM before Docker sends SIGKILL.
    stop_grace_period: 30s
    # Least privilege: the image's root filesystem (binaries, runtimes, default config) is
    # read-only; the service writes only to the volumes below and /tmp. What breaks if tightened
    # further: without the tmpfs, model export and some runtime temp files fail; without a
    # writable ./config the config cannot be saved (the entrypoint refuses to start); without a
    # writable ./cache every start recompiles the models; without the `data` volume web UI
    # downloads, benchmark datasets and exports fail.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image runs as its `openvino` user. ./cache and ./config must be writable by it: create
    # them before the first `up` (`mkdir -p cache config`; docker creates missing ones as root)
    # and, if your user's uid differs, either chown them to the image user's uid
    # (`docker run --rm --entrypoint id blue-onyx-prism:latest`) or run as their owner:
    # user: "1000:1000"
    ports:
      # Default: this host only. Blue Iris's detection API (plain HTTP, no login). Blue Iris on
      # another machine: use the LAN line below instead, ideally with a LAN address of this host
      # (`192.168.1.10:32168:32168`) rather than all interfaces.
      - "127.0.0.1:32168:32168"
      # The web UI over HTTPS, on this host only too; every browser signs in (inside Docker every
      # client arrives from the bridge network, so this host's browser is no exception). On the
      # first start the log says there is no account yet: print the one-time setup code with
      #   docker exec blue-onyx-prism /app/blue-onyx-prism --config /app/config/blue_onyx_prism_config.json setup-code
      # and open https://127.0.0.1:32169/setup. The certificate is self-signed and kept in the
      # `data` volume (with the accounts and the API token); compare the browser's SHA-256
      # fingerprint with the one `... tls-fingerprint` prints. To reach it from your PC, bind a
      # LAN address of this host (`192.168.1.10:32169:32169`) rather than all interfaces, or use
      # an SSH tunnel. Docker hides the client's address, so the binding is the network gate.
      - "127.0.0.1:32169:32169"
      # Blue Iris on another machine:
      # - "32168:32168"
    devices:
      - /dev/dri:/dev/dri
    # Numeric GID of the host's `render` group (`getent group render | cut -d: -f3`); group names
    # do not resolve inside the container.
    group_add:
      - "${RENDER_GID:-109}"
      - "${VIDEO_GID:-44}"
    volumes:
      # Named volume: starts with the models fetched at image build time (`fetch --for-config`
      # on deploy/docker-config.json). Use `./models:/app/models` instead to bring your own.
      - models:/app/models
      # Data root (`download_dir` in the config): web UI downloads, benchmark datasets, exports.
      - data:/app/data
      - ./cache:/app/cache
      # The default config (auto_download: false, IPcam-general on `auto`) is copied here on
      # first start; edit it, then restart the container.
      - ./config:/app/config

volumes:
  models:
  data:
