# The image ships OpenVINO (Intel GPU via /dev/dri, and CPU) plus the ONNX Runtime CPU build
# (`ort:cpu`). CUDA/NVIDIA is not available in this image; `"device": "auto"` picks openvino:gpu
# when /dev/dri is passed through, else openvino:cpu.
services:
  blue-onyx-prism:
    image: blue-onyx-prism:latest
    build:
      context: ..
    container_name: blue-onyx-prism
    restart: unless-stopped
    ports:
      # Default: this host only. Inside Docker every client (the host's browser too) arrives from
      # the bridge network, never loopback, so the admin pages answer 403 until
      # `"allow_remote_admin": true` is set in config/blue_onyx_prism_config.json; with this line
      # that still reaches only this host (or an SSH tunnel to it).
      - "127.0.0.1:32168:32168"
      # Blue Iris on another machine: use this line instead. allow_remote_admin then opens the
      # admin pages to the whole LAN: keep it false and edit the config file in ./config (then
      # `docker compose restart`), or turn it on only while you use the web UI. See README, Docker.
      # - "32168:32168"
    devices:
      - /dev/dri:/dev/dri
    # Numeric GID of the host's `render` group (`getent group render | cut -d: -f3`); group names
    # do not resolve inside the container.
    group_add:
      - "${RENDER_GID:-109}"
      - "${VIDEO_GID:-44}"
    volumes:
      # Named volume: starts with the models fetched at image build time (`fetch --for-config`
      # on deploy/docker-config.json). Use `./models:/app/models` instead to bring your own.
      - models:/app/models
      - ./cache:/app/cache
      # The default config (auto_download: false, IPcam-general on `auto`) is copied here on
      # first start; edit it, then restart the container.
      - ./config:/app/config

volumes:
  models:
