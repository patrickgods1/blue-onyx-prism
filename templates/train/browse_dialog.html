<dialog id="browse-dialog">
  <h3 id="browse-title">Choose a folder</h3>
  <div class="browse-bar">
    <select id="browse-roots" aria-label="Places"></select>
    <button type="button" id="browse-up" class="small">Up</button>
  </div>
  <div id="browse-path" class="browse-path"></div>
  <div id="browse-list" class="browse-list"></div>
  <p id="browse-msg" class="muted" role="status"></p>
  <div class="actions"><button type="button" id="browse-use" hidden>Use this folder</button><button type="button" id="browse-cancel">Cancel</button></div>
</dialog>
<script src="/static/browse.js?v={{ version }}"></script>
