[package]
name = "blue-onyx-prism"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Blue Iris compatible object detection service on OpenVINO and ONNX Runtime, with hardware-based device selection"
repository = "https://github.com/patrickgods1/blue-onyx-prism"
default-run = "blue-onyx-prism"
rust-version = "1.99"

[lib]
name = "blue_onyx_prism"
path = "src/lib.rs"

[[bin]]
name = "blue-onyx-prism"
path = "src/bin/blue_onyx_prism.rs"

[[bin]]
name = "blue-onyx-prism-service"
path = "src/bin/blue_onyx_prism_service.rs"

[[bin]]
name = "blue-onyx-prism-benchmark"
path = "src/bin/blue_onyx_prism_benchmark.rs"

[[bin]]
name = "test-blue-onyx-prism"
path = "src/bin/test_blue_onyx_prism.rs"

[features]
default = ["onnxruntime"]
# ONNX Runtime backend (CUDA, TensorRT, DirectML, CoreML, CPU execution providers).
onnxruntime = ["dep:ort"]

[dependencies]
openvino = { version = "=0.11.0", features = ["runtime-linking"] }
# Same version/feature as `openvino` uses; `library::load_from` loads openvino_c by explicit path
# (no environment variable) in later registry generations.
openvino-sys = { version = "=0.11.0", features = ["runtime-linking"] }
anyhow = "1"
thiserror = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "tokio", "query", "form"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
crossbeam-channel = "0.5"
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
fast_image_resize = { version = "6", features = ["image"] }
zune-jpeg = "0.5"
zune-core = "0.5"
jpeg-encoder = { version = "0.7", features = ["std", "simd"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
indicatif = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "multipart", "stream", "http2"] }
futures-util = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
# SHA-256 of downloads (already in the tree via other crates).
sha2 = "0.11"
num_cpus = "1"
base64 = "0.23"
# Same major as `ort`'s `preload-dylibs` dependency (0.9), so `dl_error` takes its errors too
# (openvino-sys 0.11 still builds its own 0.8). Used to preload libtbb/libopenvino (Unix) and to
# probe the ONNX Runtime / CUDA libraries.
libloading = "0.9"
# ONNX Runtime (feature `onnxruntime`): the shared library is loaded at runtime (`load-dynamic`),
# so nothing is linked or downloaded at build time. All `ort` code lives in src/backend/ort.rs.
# No `api-NN` feature: any ONNX Runtime 1.17+ library loads (`setup-onnxruntime` pins 1.24.4).
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic", "tracing", "cuda", "tensorrt", "directml", "coreml"] }
arc-swap = "1"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
# The HTTP listener (`server::serve_on`): hyper with a timer, so request-head and idle
# keep-alive timeouts apply, plus graceful shutdown. Already in the tree through axum/reqwest.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "http1"] }
# `Service::call` on the router per connection; already a dependency of axum.
tower = { version = "0.5", default-features = false, features = ["util"] }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = "11"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
tracing-layer-win-eventlog = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# `setpriority` for low-priority CLI benchmarks (`backend::priority`).
libc = "0.2"

[dev-dependencies]
# Router tests (`ServiceExt::oneshot`); already a transitive dependency of axum.
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Linux packages (packaging/linux/build.sh): `cargo deb` and `cargo generate-rpm`. Runtimes are not
# bundled (the service downloads them into /var/lib/blue-onyx-prism on first start). The unit is
# generated from deploy/blue-onyx-prism.service into packaging/linux/build/ by build.sh.
[package.metadata.deb]
maintainer = "Patrick Yu <60832092+patrickgods1@users.noreply.github.com>"
copyright = "Patrick Yu"
section = "net"
priority = "optional"
revision = "1"
depends = "$auto, systemd"
extended-description = """\
Object-detection HTTP service for Blue Iris (CodeProject.AI-compatible API) on OpenVINO and \
ONNX Runtime. Installs a systemd service running as the blueonyx user; config and data live in \
/var/lib/blue-onyx-prism. OpenVINO / ONNX Runtime libraries are downloaded on first start."""
maintainer-scripts = "packaging/linux/debian"
assets = [
    ["target/release/blue-onyx-prism", "opt/blue-onyx-prism/", "755"],
    ["target/release/blue-onyx-prism-benchmark", "opt/blue-onyx-prism/", "755"],
    ["LICENSE", "opt/blue-onyx-prism/", "644"],
    ["THIRD_PARTY_LICENSES.md", "opt/blue-onyx-prism/", "644"],
    ["README.md", "opt/blue-onyx-prism/", "644"],
    ["scripts/systemd_common.sh", "opt/blue-onyx-prism/scripts/", "644"],
    ["packaging/linux/pkg-scriptlet.sh", "opt/blue-onyx-prism/scripts/pkg_scriptlet.sh", "755"],
    ["packaging/linux/build/blue-onyx-prism.service", "usr/lib/systemd/system/", "644"],
    ["packaging/linux/blue-onyx-prism.sysusers", "usr/lib/sysusers.d/blue-onyx-prism.conf", "644"],
]

[package.metadata.generate-rpm]
release = "1"
assets = [
    { source = "target/release/blue-onyx-prism", dest = "/opt/blue-onyx-prism/blue-onyx-prism", mode = "755" },
    { source = "target/release/blue-onyx-prism-benchmark", dest = "/opt/blue-onyx-prism/blue-onyx-prism-benchmark", mode = "755" },
    { source = "LICENSE", dest = "/opt/blue-onyx-prism/LICENSE", mode = "644" },
    { source = "THIRD_PARTY_LICENSES.md", dest = "/opt/blue-onyx-prism/THIRD_PARTY_LICENSES.md", mode = "644" },
    { source = "README.md", dest = "/opt/blue-onyx-prism/README.md", mode = "644" },
    { source = "scripts/systemd_common.sh", dest = "/opt/blue-onyx-prism/scripts/systemd_common.sh", mode = "644" },
    { source = "packaging/linux/pkg-scriptlet.sh", dest = "/opt/blue-onyx-prism/scripts/pkg_scriptlet.sh", mode = "755" },
    { source = "packaging/linux/build/blue-onyx-prism.service", dest = "/usr/lib/systemd/system/blue-onyx-prism.service", mode = "644" },
    { source = "packaging/linux/blue-onyx-prism.sysusers", dest = "/usr/lib/sysusers.d/blue-onyx-prism.conf", mode = "644" },
]
post_install_script = "packaging/linux/rpm/post_install.sh"
pre_uninstall_script = "packaging/linux/rpm/pre_uninstall.sh"
post_uninstall_script = "packaging/linux/rpm/post_uninstall.sh"

[package.metadata.generate-rpm.requires]
systemd = "*"
